<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8e7">
  <title>Little Steps — Letters & Numbers</title>
  <meta name="description" content="A quiet, child-friendly space for learning letters and numbers.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Little Steps">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f7c84b'/%3E%3Cpath d='M16 45 29 16h7l13 29h-9l-2-6H27l-2 6Zm14-14h6l-3-9Z' fill='%232d4059'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#26384a;--muted:#60758a;--cream:#fff8e7;--paper:#fffdfa;--yellow:#f7c84b;--blue:#6fc5d6;--coral:#f38b70;--green:#76b98b;--purple:#8f82c7;--shadow:0 8px 0 rgba(38,56,74,.1);--radius:26px}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--cream);color:var(--ink);font-family:ui-rounded,"Avenir Next Rounded","Nunito",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
    button{font:inherit;color:inherit;touch-action:manipulation}
    .app{max-width:1100px;margin:auto;padding:18px clamp(16px,4vw,42px) 40px}
    header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}
    .brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:clamp(1.25rem,3vw,1.7rem)}
    .mark{width:48px;height:48px;border-radius:16px;background:var(--yellow);display:grid;place-items:center;box-shadow:0 5px 0 #dbad2d;font-size:1.45rem}
    .quiet{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:800;font-size:.9rem;background:#fff8;padding:9px 13px;border-radius:999px}
    .sound-toggle,.install-button{border:2px solid var(--ink);background:white;border-radius:999px;padding:9px 13px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
    .install-button{background:var(--yellow)}.install-button[hidden]{display:none}
    .dot{width:10px;height:10px;border-radius:50%;background:var(--green)}
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
    .tab{min-height:64px;border:3px solid transparent;border-radius:20px;background:#fff9;padding:10px;font-weight:900;font-size:clamp(.95rem,2vw,1.15rem);cursor:pointer}
    .tab[aria-selected="true"]{background:white;border-color:var(--ink);box-shadow:0 5px 0 var(--ink);transform:translateY(-2px)}
    .panel{display:none}.panel.active{display:block}
    .stage{background:var(--paper);border:3px solid var(--ink);border-radius:32px;box-shadow:var(--shadow);padding:clamp(18px,4vw,36px);min-height:540px}
    .topline{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:26px}
    h1{font-size:clamp(1.35rem,4vw,2.1rem);margin:0;line-height:1.1}
    .prompt{color:var(--muted);font-weight:800;margin:7px 0 0}
    .small-btn{border:2px solid var(--ink);background:white;border-radius:16px;padding:10px 14px;font-weight:900;box-shadow:0 4px 0 var(--ink);cursor:pointer}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:14px}
    .tile{aspect-ratio:1;border:3px solid var(--ink);border-radius:24px;background:white;display:grid;place-items:center;font-size:clamp(2.5rem,8vw,4.5rem);font-weight:1000;box-shadow:0 6px 0 var(--ink);cursor:pointer;transition:transform .1s,box-shadow .1s}
    .grid[dir="rtl"] .tile{font-family:"Geeza Pro","Noto Naskh Arabic","Arabic Typesetting",serif;font-weight:700;font-size:clamp(3rem,9vw,5rem);line-height:1.25}
    .tile:active,.tile.chosen{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
    .tile:nth-child(5n+1){background:#fff1b9}.tile:nth-child(5n+2){background:#dff5f8}.tile:nth-child(5n+3){background:#fee0d8}.tile:nth-child(5n+4){background:#e3f3e7}.tile:nth-child(5n){background:#ece8fa}
    .focus-card{display:grid;grid-template-columns:minmax(220px,1fr) minmax(220px,1fr);gap:26px;align-items:stretch}
    .big-card{min-height:350px;border:4px solid var(--ink);border-radius:30px;background:#fff1b9;display:grid;place-items:center;position:relative;overflow:hidden}
    .big-symbol{font-size:clamp(9rem,25vw,15rem);font-weight:1000;line-height:1}
    .guide{position:absolute;inset:18%;border:5px dashed #26384a55;border-radius:45%}
    .side{display:flex;flex-direction:column;gap:16px;justify-content:center}
    .say{font-size:clamp(1.5rem,5vw,2.6rem);font-weight:1000;margin:0}
    .example{border:3px solid var(--ink);border-radius:24px;background:#dff5f8;padding:22px;text-align:center;font-size:1.3rem;font-weight:900}
    .shape-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}.shape{width:40px;height:40px;background:var(--coral);border:3px solid var(--ink)}.circle{border-radius:50%}.diamond{transform:rotate(45deg);margin:7px}
    .navrow{display:flex;gap:12px;margin-top:20px}.navrow button{flex:1;min-height:60px;border:3px solid var(--ink);border-radius:18px;background:white;font-weight:1000;font-size:1.05rem;box-shadow:0 5px 0 var(--ink);cursor:pointer}
    .match-board{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:720px;margin:auto}
    .match-col{display:grid;gap:14px}
    .match{min-height:86px;border:3px solid var(--ink);border-radius:22px;background:white;font-size:2.4rem;font-weight:1000;box-shadow:0 5px 0 var(--ink);cursor:pointer}
    .match.selected{outline:6px solid var(--yellow);outline-offset:3px}.match.done{background:#dff3e4;color:#315f40;box-shadow:none;transform:translateY(5px)}
    .stars{min-height:40px;text-align:center;font-size:2rem;margin:18px 0 0;letter-spacing:6px}.note{text-align:center;color:var(--muted);font-weight:800;margin-top:22px}
    @media(max-width:650px){.app{padding:12px 12px 28px}.quiet{display:none}.sound-toggle,.install-button{padding:9px 10px;font-size:.85rem}.tabs{gap:6px}.tab{min-height:58px;padding:8px 4px}.stage{border-radius:25px;min-height:0}.focus-card{grid-template-columns:1fr}.big-card{min-height:275px}.side{text-align:center}.match-board{gap:12px}.match{min-height:72px}.grid{grid-template-columns:repeat(4,1fr);gap:9px}.tile{border-radius:18px}.topline{align-items:flex-start}}
    @media(prefers-reduced-motion:no-preference){.panel.active{animation:in .2s ease-out}@keyframes in{from{opacity:.2;transform:translateY(6px)}}}
    :focus-visible{outline:6px solid #2d78c4;outline-offset:3px}
  </style>
</head>
<body>
<main class="app">
  <header><div class="brand"><div class="mark">A1</div><span>Little Steps</span></div><div style="display:flex;align-items:center;gap:10px"><div class="quiet"><span class="dot"></span><span>No music</span></div><button class="sound-toggle" id="languageToggle" aria-label="Switch to Arabic">EN / عربي</button><button class="install-button" id="installButton" hidden>Install app</button><button class="sound-toggle" id="soundToggle" aria-pressed="true" aria-label="Turn sound off">🔊 Sound</button></div></header>
  <nav class="tabs" aria-label="Activities">
    <button class="tab" id="lettersTab" data-tab="letters" aria-selected="true">ABC</button>
    <button class="tab" id="numbersTab" data-tab="numbers" aria-selected="false">123</button>
    <button class="tab" id="matchTab" data-tab="match" aria-selected="false">Match</button>
  </nav>

  <section id="letters" class="panel active"><div class="stage">
    <div class="topline"><div><h1 id="lettersTitle">Choose a letter</h1><p class="prompt" id="lettersPrompt">Tap any big letter.</p></div><button class="small-btn" id="letterCase">a / A</button></div>
    <div class="grid" id="letterGrid"></div>
  </div></section>

  <section id="numbers" class="panel"><div class="stage">
    <div class="topline"><div><h1 id="numbersTitle">Choose a number</h1><p class="prompt" id="numbersPrompt">Tap, look, and count the shapes.</p></div></div>
    <div class="focus-card">
      <div class="big-card"><div class="big-symbol" id="numberSymbol">1</div></div>
      <div class="side"><p class="say" id="numberWord">One</p><div class="example"><span id="countLabel">1 shape</span><div class="shape-row" id="shapes"></div></div><div class="navrow"><button id="prevNum" aria-label="Previous number">← Back</button><button id="nextNum" aria-label="Next number">Next →</button></div></div>
    </div>
  </div></section>

  <section id="match" class="panel"><div class="stage">
    <div class="topline"><div><h1 id="matchTitle">Match the pairs</h1><p class="prompt" id="matchPrompt">Tap a number, then tap the same group.</p></div><button class="small-btn" id="newMatch">New set</button></div>
    <div class="match-board"><div class="match-col" id="matchNums"></div><div class="match-col" id="matchShapes"></div></div>
    <div class="stars" id="stars" aria-live="polite"></div><p class="note" id="quietNote">Spoken words and gentle feedback. No music or moving pictures.</p>
  </div></section>
</main>
<script>
  let soundOn=true;
  const soundButton=document.querySelector('#soundToggle');
  soundButton.onclick=()=>{soundOn=!soundOn;window.speechSynthesis?.cancel();if(!soundOn&&activeAudio){activeAudio.pause();activeAudio.currentTime=0}soundButton.textContent=soundOn?'🔊 Sound':'🔇 Muted';soundButton.setAttribute('aria-pressed',String(soundOn));soundButton.setAttribute('aria-label',soundOn?'Turn sound off':'Turn sound on')};
  let availableVoices=[];
  function loadVoices(){if('speechSynthesis' in window)availableVoices=window.speechSynthesis.getVoices()}
  loadVoices();
  if('speechSynthesis' in window)window.speechSynthesis.addEventListener('voiceschanged',loadVoices);
  let activeAudio;
  function browserSpeech(text){if(!('speechSynthesis' in window))return;loadVoices();window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);const wantedLanguage=language==='ar'?'ar-SA':'en-GB';const matchingVoice=availableVoices.find(voice=>voice.lang.toLowerCase()===wantedLanguage.toLowerCase())||availableVoices.find(voice=>voice.lang.toLowerCase().startsWith(language==='ar'?'ar':'en'));utterance.lang=wantedLanguage;if(matchingVoice)utterance.voice=matchingVoice;utterance.rate=language==='ar'?.58:.72;utterance.pitch=1.05;utterance.volume=.9;window.speechSynthesis.resume();window.speechSynthesis.speak(utterance)}
  function speak(text,audioFile){if(!soundOn)return;if(activeAudio){activeAudio.pause();activeAudio.currentTime=0}if(language==='ar'&&audioFile){activeAudio=new Audio(audioFile);activeAudio.volume=.9;activeAudio.play().catch(()=>browserSpeech(text));return}browserSpeech(text)}
  function tone(kind='tap'){if(!soundOn)return;const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;const ctx=new Audio();const notes=kind==='good'?[523,659,784]:kind==='try'?[260]:[440];notes.forEach((freq,i)=>{const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(.0001,ctx.currentTime+i*.1);gain.gain.exponentialRampToValueAtTime(.08,ctx.currentTime+i*.1+.01);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+i*.1+.12);osc.connect(gain).connect(ctx.destination);osc.start(ctx.currentTime+i*.1);osc.stop(ctx.currentTime+i*.1+.13)});setTimeout(()=>ctx.close(),500)}
  const latinLetters=[
    {glyph:'A',speech:'A. Ah.'},{glyph:'B',speech:'B. Buh.'},
    {glyph:'C',speech:'C. Kuh.'},{glyph:'D',speech:'D. Duh.'},
    {glyph:'E',speech:'E. Eh.'},{glyph:'F',speech:'F. Fff.'},
    {glyph:'G',speech:'G. Guh.'},{glyph:'H',speech:'H. Huh.'},
    {glyph:'I',speech:'I. Ih.'},{glyph:'J',speech:'J. Juh.'},
    {glyph:'K',speech:'K. Kuh.'},{glyph:'L',speech:'L. Lll.'},
    {glyph:'M',speech:'M. Mmm.'},{glyph:'N',speech:'N. Nnn.'},
    {glyph:'O',speech:'O. Aw.'},{glyph:'P',speech:'P. Puh.'},
    {glyph:'Q',speech:'Q. Kwuh.'},{glyph:'R',speech:'R. Rrr.'},
    {glyph:'S',speech:'S. Sss.'},{glyph:'T',speech:'T. Tuh.'},
    {glyph:'U',speech:'U. Uh.'},{glyph:'V',speech:'V. Vvv.'},
    {glyph:'W',speech:'W. Wuh.'},{glyph:'X',speech:'X. Kss.'},
    {glyph:'Y',speech:'Y. Yuh.'},{glyph:'Z',speech:'Zed. Zzz.'}
  ];
  const arabicLetters=[
    {glyph:'ء',name:'هَمْزَة',audio:'audio/ar/hamza.wav'},
    {glyph:'ا',name:'أَلِف',audio:'audio/ar/alif.wav'},{glyph:'ب',name:'بَاء',audio:'audio/ar/baa.wav'},{glyph:'ت',name:'تَاء',audio:'audio/ar/taa.wav'},{glyph:'ث',name:'ثَاء',audio:'audio/ar/thaa.wav'},
    {glyph:'ج',name:'جِيم',audio:'audio/ar/jeem.wav'},{glyph:'ح',name:'حَاء',audio:'audio/ar/haa.wav'},{glyph:'خ',name:'خَاء',audio:'audio/ar/khaa.wav'},{glyph:'د',name:'دَال',audio:'audio/ar/daal.wav'},
    {glyph:'ذ',name:'ذَال',audio:'audio/ar/dhaal.wav'},{glyph:'ر',name:'رَاء',audio:'audio/ar/raa.wav'},{glyph:'ز',name:'زَاي',audio:'audio/ar/zaay.wav'},{glyph:'س',name:'سِين',audio:'audio/ar/seen.wav'},
    {glyph:'ش',name:'شِين',audio:'audio/ar/sheen.wav'},{glyph:'ص',name:'صَاد',audio:'audio/ar/saad.wav'},{glyph:'ض',name:'ضَاد',audio:'audio/ar/daad.wav'},{glyph:'ط',name:'طَاء',audio:'audio/ar/taa_heavy.wav'},
    {glyph:'ظ',name:'ظَاء',audio:'audio/ar/zaa_heavy.wav'},{glyph:'ع',name:'عَيْن',audio:'audio/ar/ayn.wav'},{glyph:'غ',name:'غَيْن',audio:'audio/ar/ghayn.wav'},{glyph:'ف',name:'فَاء',audio:'audio/ar/faa.wav'},
    {glyph:'ق',name:'قَاف',audio:'audio/ar/qaaf.wav'},{glyph:'ك',name:'كَاف',audio:'audio/ar/kaaf.wav'},{glyph:'ل',name:'لَام',audio:'audio/ar/laam.wav'},{glyph:'م',name:'مِيم',audio:'audio/ar/meem.wav'},
    {glyph:'ن',name:'نُون',audio:'audio/ar/noon.wav'},{glyph:'ه',name:'هَاء',audio:'audio/ar/haa_soft.wav'},{glyph:'و',name:'وَاو',audio:'audio/ar/waaw.wav'},{glyph:'ي',name:'يَاء',audio:'audio/ar/yaa.wav'}
  ];
  const englishWords=['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten'];
  const arabicWords=['صِفْر','وَاحِد','اِثْنَان','ثَلَاثَة','أَرْبَعَة','خَمْسَة','سِتَّة','سَبْعَة','ثَمَانِيَة','تِسْعَة','عَشَرَة'];
  const arabicNumberAudio=['zero','one','two','three','four','five','six','seven','eight','nine','ten'].map(name=>`audio/ar/${name}.wav`);
  const arabicDigits=['٠','١','٢','٣','٤','٥','٦','٧','٨','٩','١٠'];
  let language='en';
  const grid=document.querySelector('#letterGrid');let lower=false;
  function currentLetters(){return language==='ar'?arabicLetters:latinLetters}
  function currentWords(){return language==='ar'?arabicWords:englishWords}
  function digit(n){return language==='ar'?arabicDigits[n]:String(n)}
  function drawLetters(){grid.dir=language==='ar'?'rtl':'ltr';grid.innerHTML=currentLetters().map(letter=>{const glyph=language==='ar'?letter.glyph:(lower?letter.glyph.toLowerCase():letter.glyph);const pronunciation=language==='ar'?letter.name:letter.speech;const audio=language==='ar'?letter.audio:'';return `<button class="tile" data-speech="${pronunciation}" data-audio="${audio}" aria-label="${language==='ar'?'حرف':'Letter'} ${pronunciation}">${glyph}</button>`}).join('');}
  drawLetters();
  document.querySelector('#letterCase').onclick=()=>{lower=!lower;drawLetters()};
  grid.addEventListener('click',e=>{if(!e.target.matches('.tile'))return;document.querySelectorAll('.tile').forEach(x=>x.classList.remove('chosen'));e.target.classList.add('chosen');speak(e.target.dataset.speech,e.target.dataset.audio)});
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected','false'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));t.setAttribute('aria-selected','true');document.querySelector('#'+t.dataset.tab).classList.add('active')});
  let num=1;
  function drawNum(){const words=currentWords();document.querySelector('#numberSymbol').textContent=digit(num);document.querySelector('#numberWord').textContent=words[num];document.querySelector('#countLabel').textContent=language==='ar'?`${digit(num)} ${num===1?'شكل':'أشكال'}`:(num===1?'1 shape':`${num} shapes`);const s=document.querySelector('#shapes');s.innerHTML=num===0?`<span style="color:var(--muted)">${language==='ar'?'لا أشكال':'No shapes'}</span>`:Array.from({length:num},(_,i)=>`<i class="shape ${i%3===0?'circle':i%3===1?'':'diamond'}"></i>`).join('')}
  function numberAudio(){return language==='ar'?arabicNumberAudio[num]:''}
  document.querySelector('#prevNum').onclick=()=>{num=(num+10)%11;drawNum();speak(currentWords()[num],numberAudio())};document.querySelector('#nextNum').onclick=()=>{num=(num+1)%11;drawNum();speak(currentWords()[num],numberAudio())};document.querySelector('#numberSymbol').parentElement.onclick=()=>speak(currentWords()[num],numberAudio());drawNum();
  let chosen=null,completed=0;
  function dots(n){return `<div class="shape-row" aria-label="${n} shapes">${Array.from({length:n},()=>'<i class="shape circle"></i>').join('')}</div>`}
  function shuffle(a){return a.sort(()=>Math.random()-.5)}
  function newGame(){chosen=null;completed=0;document.querySelector('#stars').textContent='';const set=shuffle([1,2,3,4,5].slice()).slice(0,3).sort();document.querySelector('#matchNums').innerHTML=set.map(n=>`<button class="match" data-n="${n}">${digit(n)}</button>`).join('');document.querySelector('#matchShapes').innerHTML=shuffle(set.slice()).map(n=>`<button class="match" data-n="${n}" aria-label="${n} shapes">${dots(n)}</button>`).join('')}
  document.querySelector('#newMatch').onclick=()=>{newGame();tone()};document.querySelector('#matchNums').onclick=e=>{const b=e.target.closest('.match');if(!b||b.classList.contains('done'))return;document.querySelectorAll('#matchNums .match').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');chosen=b;const value=Number(b.dataset.n);speak(currentWords()[value],language==='ar'?arabicNumberAudio[value]:'')};
  document.querySelector('#matchShapes').onclick=e=>{const b=e.target.closest('.match');if(!b||!chosen||b.classList.contains('done'))return;if(b.dataset.n===chosen.dataset.n){b.classList.add('done');chosen.classList.add('done');chosen.classList.remove('selected');chosen=null;completed++;document.querySelector('#stars').textContent='★'.repeat(completed);tone('good');if(completed===3){document.querySelector('#stars').textContent=language==='ar'?'★ ★ ★  أَحْسَنْت!':'★ ★ ★  Well done!';setTimeout(()=>speak(language==='ar'?'أَحْسَنْت':'Well done!'),350)}}else{tone('try');b.animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'none'}],{duration:180})}};newGame();
  let installPrompt;const installButton=document.querySelector('#installButton');
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;installButton.hidden=false});
  installButton.onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;installButton.hidden=true}else{alert('On iPhone or iPad: tap Share, then Add to Home Screen.')}};
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!navigator.standalone)installButton.hidden=false;
  window.addEventListener('appinstalled',()=>{installButton.hidden=true});
  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
  function applyLanguage(){const ar=language==='ar';document.documentElement.lang=language;document.querySelector('#letterCase').hidden=ar;document.querySelector('#lettersTab').textContent=ar?'أ ب ج':'ABC';document.querySelector('#numbersTab').textContent=ar?'١٢٣':'123';document.querySelector('#matchTab').textContent=ar?'طابق':'Match';document.querySelector('#lettersTitle').textContent=ar?'اختر حرفًا':'Choose a letter';document.querySelector('#lettersPrompt').textContent=ar?'اضغط على أي حرف كبير.':'Tap any big letter.';document.querySelector('#numbersTitle').textContent=ar?'اختر رقمًا':'Choose a number';document.querySelector('#numbersPrompt').textContent=ar?'اضغط وانظر وعدّ الأشكال.':'Tap, look, and count the shapes.';document.querySelector('#matchTitle').textContent=ar?'طابق الأزواج':'Match the pairs';document.querySelector('#matchPrompt').textContent=ar?'اضغط رقمًا، ثم اضغط المجموعة المطابقة.':'Tap a number, then tap the same group.';document.querySelector('#newMatch').textContent=ar?'مجموعة جديدة':'New set';document.querySelector('#prevNum').textContent=ar?'السابق ←':'← Back';document.querySelector('#nextNum').textContent=ar?'→ التالي':'Next →';document.querySelector('#quietNote').textContent=ar?'نطق لطيف دون موسيقى أو صور متحركة.':'Spoken words and gentle feedback. No music or moving pictures.';document.querySelector('#languageToggle').setAttribute('aria-label',ar?'Switch to English':'Switch to Arabic');drawLetters();drawNum();newGame()}
  document.querySelector('#languageToggle').onclick=()=>{language=language==='en'?'ar':'en';applyLanguage();speak(language==='ar'?'العربية':'English')};
</script>
</body>
</html>
